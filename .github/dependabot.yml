# Keeps the four toolchains this project spans from drifting. Grouped and
# monthly rather than per-dependency and weekly: a Windows service with a
# manual acceptance run cannot absorb a stream of individual bumps.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    groups:
      ui-dependencies:
        patterns: ["*"]
    # typescript-eslint's peer range still caps TypeScript below 6.1, so a
    # major TS bump cannot resolve: npm ci fails, taking every other bump
    # grouped with it down too. Drop this once the linter declares support
    # for the next major.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /ui/src-tauri
    schedule:
      interval: monthly
    groups:
      shell-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
