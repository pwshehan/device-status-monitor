name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pushing three times to a branch should not leave three full builds racing:
# only the newest commit's result is of any interest, and the shell job takes
# four minutes on a Windows runner. Deliberately not applied to release.yml —
# cancelling a release halfway through publishing would leave a tag with some
# of its assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Format check
        run: |
          out=$(gofmt -l ./cmd ./internal)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The GUI cannot cross-compile, but the engine can and must — this is the
      # guard that keeps a Windows-only regression from reaching the release job.
      - name: Windows cross-build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build ./...

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The active LTS line. jsdom 30 needs >=24.15, and pinning the major
          # here keeps a developer's machine and CI on the same runtime.
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build is the real check that the app compiles as shipped, not just
      # that its types agree.
      - name: Build
        run: npm run build

  # The desktop shell only builds on Windows — MSVC and WebView2 headers — so
  # this is the one job that would catch a broken tray, capability file or CSP
  # before a release tag does.
  shell:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - run: npm ci

      # tauri::generate_context! reads tauri.conf.json and needs frontendDist
      # to exist, so the frontend is built before Rust is compiled at all.
      - name: Build the frontend
        run: npm run build:tauri

      - name: Format check
        working-directory: ui/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: ui/src-tauri
        run: cargo clippy --all-targets -- -D warnings
