name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Format check
        run: |
          out=$(gofmt -l ./cmd ./internal)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The GUI cannot cross-compile, but the engine can and must — this is the
      # guard that keeps a Windows-only regression from reaching the release job.
      - name: Windows cross-build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build ./...
